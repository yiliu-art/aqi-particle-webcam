<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Face &amp; Motion Feed</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --border:#30363d;
    --text:#e6edf3;
    --muted:#8b949e;
    --accent:#3fb950;
    --accent-dim:#2ea043;
    --warn:#d29922;
    --danger:#f85149;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }
  .stage{
    position:fixed;
    inset:0;
    background:#000;
    border:10px solid #000;
    overflow:hidden;
    z-index:0;
  }
  video, canvas{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .hud{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
    max-height:400px; /* JS overrides this to 48% of the real viewport height on load/resize */
    overflow-y:auto;
    padding:14px 16px 18px;
  }
  #aqiTint{
    position:absolute;
    inset:0;
    background:rgba(248,81,73,0);
    pointer-events:none;
    transition:background-color 1s ease;
  }
  #placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:0.95rem;
    text-align:center;
    padding:0 20px;
  }
  .controls{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
    justify-content:center;
  }
  button{
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--border);
    padding:10px 18px;
    border-radius:8px;
    font-size:0.9rem;
    cursor:pointer;
    transition:background 0.15s, border-color 0.15s;
  }
  .icon-btn{
    width:44px;
    height:44px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-btn svg{
    width:20px;
    height:20px;
  }
  button:hover:not(:disabled){
    border-color:var(--accent-dim);
  }
  button:disabled{
    opacity:0.45;
    cursor:not-allowed;
  }
  #cameraBtn{
    background:var(--accent-dim);
    border-color:var(--accent-dim);
  }
  #cameraBtn:hover:not(:disabled){
    background:var(--accent);
  }
  #cameraBtn.recording{
    background:#3a1f1f;
    border-color:#5a2a2a;
  }
  #cameraBtn.recording:hover:not(:disabled){
    background:#4a2525;
  }
  .city-wrap{
    position:relative;
  }
  .city-wrap svg{
    pointer-events:none;
  }
  #citySelect{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    border:none;
    background:transparent;
    padding:0;
    cursor:pointer;
  }
  .toggles{
    display:flex;
    gap:18px;
    margin-top:16px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .toggle{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.88rem;
    color:var(--muted);
    user-select:none;
  }
  .toggle input{
    accent-color:var(--accent);
    width:16px;
    height:16px;
    cursor:pointer;
  }
  .status-bar{
    display:flex;
    gap:12px;
    margin-top:20px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .pill{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 14px;
    font-size:0.82rem;
    color:var(--muted);
  }
  .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--muted);
    flex-shrink:0;
  }
  .dot.on{background:var(--accent);}
  .dot.alert{background:var(--danger);}
  #legend{display:contents;}
  #indicatorPanel .pill, #indicatorPanel .toggle{
    color:#000;
  }
  #errorBox{
    margin-top:12px;
    max-width:min(90vw,720px);
    background:#2b1517;
    border:1px solid #5a2a2a;
    color:#ffb3ab;
    padding:10px 14px;
    border-radius:8px;
    font-size:0.85rem;
    display:none;
  }
  .hint{
    color:var(--muted);
    font-size:0.78rem;
    margin-top:14px;
    text-align:center;
    max-width:600px;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div id="placeholder">Camera is off.<br>Click "Start Camera" to begin.</div>
  <video id="video" playsinline autoplay muted style="display:none"></video>
  <div id="aqiTint"></div>
  <canvas id="overlay" style="display:none"></canvas>
</div>

<div class="hud">

<div id="indicatorPanel" class="status-bar" style="display:none">
  <div class="pill" style="display:none"><span class="dot" id="camDot"></span><span id="camStatus">Camera: off</span></div>
  <div class="pill" style="display:none"><span class="dot" id="faceDot"></span><span id="faceStatus">Faces: 0</span></div>
  <div class="pill" style="display:none"><span class="dot" id="motionDot"></span><span id="motionStatus">Motion: idle</span></div>
  <div class="pill"><span class="dot" id="aqiDot"></span><span id="aqiStatus">AQI: loading&hellip;</span></div>
  <div class="pill" style="display:none"><span id="fpsStatus">FPS: &ndash;</span></div>
  <span id="legend"></span>
</div>

<div class="toggles" style="display:none">
  <label class="toggle">
    <input type="checkbox" id="faceToggle" checked>
    Face detection
  </label>
  <label class="toggle">
    <input type="checkbox" id="motionToggle" checked>
    Motion detection
  </label>
  <label class="toggle">
    <input type="checkbox" id="particleToggle" checked>
    Air quality particles
  </label>
</div>

<div class="controls">
  <div class="icon-btn city-wrap" aria-hidden="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
    <select id="citySelect" aria-label="Select city">
      <option value="bergamo">Bergamo, Italy</option>
      <option value="beijing">Beijing, China</option>
      <option value="newdelhi">New Delhi, India</option>
      <option value="zurich">Zürich, Switzerland</option>
      <option value="ndjamena">N'Djamena, Chad</option>
    </select>
  </div>
  <button id="indicatorBtn" class="icon-btn" aria-label="Air quality details" title="Air quality details">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
  </button>
  <button id="cameraBtn" class="icon-btn" aria-label="Start camera" title="Start camera">
    <svg id="cameraIconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
    <svg id="cameraIconOff" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M21 21H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h4"></path><path d="M9.34 5H15l2 3h4a2 2 0 0 1 2 2v9.34"></path><circle cx="12" cy="13" r="4"></circle></svg>
  </button>
</div>

<div id="errorBox"></div>

</div>

<script type="module">
import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const placeholder = document.getElementById("placeholder");
const cameraBtn = document.getElementById("cameraBtn");
const cameraIconOn = document.getElementById("cameraIconOn");
const cameraIconOff = document.getElementById("cameraIconOff");
const indicatorBtn = document.getElementById("indicatorBtn");
const indicatorPanel = document.getElementById("indicatorPanel");
const faceToggle = document.getElementById("faceToggle");
const motionToggle = document.getElementById("motionToggle");
const particleToggle = document.getElementById("particleToggle");
const citySelect = document.getElementById("citySelect");
const aqiTint = document.getElementById("aqiTint");
const legend = document.getElementById("legend");
const errorBox = document.getElementById("errorBox");

const camDot = document.getElementById("camDot");
const camStatus = document.getElementById("camStatus");
const faceDot = document.getElementById("faceDot");
const faceStatus = document.getElementById("faceStatus");
const motionDot = document.getElementById("motionDot");
const motionStatus = document.getElementById("motionStatus");
const aqiDot = document.getElementById("aqiDot");
const aqiStatus = document.getElementById("aqiStatus");
const fpsStatus = document.getElementById("fpsStatus");

const ctx = overlay.getContext("2d");
const stageEl = document.getElementById("stage");
const hudEl = document.querySelector(".hud");

// Some WebView hosts (notably a WebView embedded via Jetpack Compose's AndroidView)
// resolve vh/vw — and even position:fixed height auto-fill from top+bottom — to 0,
// even though window.innerHeight itself is correct. Force real pixel sizes instead
// of trusting CSS viewport units.
function syncViewportSize(){
  stageEl.style.width = window.innerWidth + "px";
  stageEl.style.height = window.innerHeight + "px";
  hudEl.style.maxHeight = Math.round(window.innerHeight * 0.48) + "px";
}
syncViewportSize();
window.addEventListener("resize", syncViewportSize);

// Offscreen canvas used only for motion detection (downsampled grayscale frames).
const motionCanvas = document.createElement("canvas");
const MOTION_W = 96, MOTION_H = 72;
motionCanvas.width = MOTION_W;
motionCanvas.height = MOTION_H;
const motionCtx = motionCanvas.getContext("2d", { willReadFrequently: true });
let prevFrame = null;

let faceDetector = null;
let faceDetectorReady = false;
let stream = null;
let rafId = null;
let lastFrameTime = performance.now();
let fpsSmoothed = 0;

// --- Air quality → particle system -----------------------------------
const CITIES = {
  bergamo: { label: "Bergamo", lat: 45.6983, lon: 9.6773 },
  beijing: { label: "Beijing", lat: 39.9042, lon: 116.4074 },
  newdelhi: { label: "New Delhi", lat: 28.6139, lon: 77.2090 },
  zurich: { label: "Zürich", lat: 47.3769, lon: 8.5417 },
  ndjamena: { label: "N'Djamena", lat: 12.1348, lon: 15.0557 },
};
const AQI_REFRESH_MS = 10 * 60 * 1000;

// Each pollutant is its own particle species: distinct color, and physical
// character (coarse dust drifts slowly, reactive gases jitter fast).
// countScale/min/max convert typical μg/m³ ranges into an on-screen count.
const POLLUTANTS = [
  { key: "pm10",             label: "PM10",  color: "#888888", radius: 6.0, jitter: 0.5, drift: 0.3, countScale: 1.3, min: 10, max: 80 },
  { key: "pm2_5",            label: "PM2.5", color: "#000000", radius: 5.0, jitter: 0.8, drift: 0.3, countScale: 2.0, min: 10, max: 80 },
  { key: "carbon_monoxide",  label: "CO",    color: "#4a3aa7", radius: 4.0, jitter: 0.7, drift: 1.4, countScale: 0.25, min: 10, max: 80 },
];

let aqi = null; // latest fetched reading, see fetchAirQuality()
let particles = [];
let motionBoost = 0; // decays each frame; motion detection bumps this up

function buildLegend(){
  legend.innerHTML = POLLUTANTS.map(p => `
    <span class="toggle"><span class="dot on" style="background:${p.color}"></span>${p.label}</span>
  `).join("");
}
buildLegend();

// Red tint over the camera stage scales with how bad the air is (EU AQI 0-120+ -> opacity 0-0.45).
// White haze over the camera stage — transparent at good air quality, increasingly
// opaque (like thick smog obscuring the view) as AQI worsens.
function updateAqiTint(){
  const ratio = Math.max(0, Math.min(1, (aqi?.european_aqi ?? 0) / 120));
  const intensity = Math.pow(ratio, 1.3) * 0.85;
  aqiTint.style.background = `rgba(245,245,220,${intensity.toFixed(2)})`;
}

async function fetchAirQuality(){
  const city = CITIES[citySelect.value];
  aqiStatus.textContent = `AQI: loading…`;
  try{
    const fields = POLLUTANTS.map(p => p.key).concat(["european_aqi","us_aqi"]).join(",");
    const url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${city.lat}&longitude=${city.lon}&current=${fields}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    aqi = json.current;
    aqiDot.classList.remove("alert");
    aqiDot.classList.add("on");
    aqiStatus.textContent = `AQI: ${aqi.european_aqi}`;
    updateAqiTint();
    initParticles(); // density/size depend on the new reading
  }catch(err){
    console.error("Air quality fetch failed:", err);
    aqiDot.classList.remove("on");
    aqiDot.classList.add("alert");
    aqiStatus.textContent = `AQI: fetch failed`;
  }
}
fetchAirQuality();
citySelect.addEventListener("change", fetchAirQuality);
setInterval(fetchAirQuality, AQI_REFRESH_MS);

function hexToRgb(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function initParticles(){
  if (!overlay.width || !overlay.height) return;
  particles = [];
  for (const species of POLLUTANTS){
    const reading = aqi?.[species.key] ?? species.min;
    const count = Math.round(Math.min(species.max, Math.max(species.min, reading * species.countScale)));
    const [br, bg, bb] = hexToRgb(species.color);
    for (let i = 0; i < count; i++){
      // Slight per-particle color/tone variation — real airborne particles are never
      // perfectly uniform — plus a soft radial falloff instead of a flat disc, and a
      // gentle size "breathing" pulse so they read as suspended matter, not sprites.
      const tone = 0.85 + Math.random() * 0.3;
      particles.push({
        x: Math.random() * overlay.width,
        y: Math.random() * overlay.height,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        r: species.radius * (0.6 + Math.random() * 0.8),
        rgb: [
          Math.min(255, Math.round(br * tone)),
          Math.min(255, Math.round(bg * tone)),
          Math.min(255, Math.round(bb * tone))
        ],
        baseAlpha: 0.35 + Math.random() * 0.4,
        phase: Math.random() * Math.PI * 2,
        pulseSpeed: 0.0015 + Math.random() * 0.002,
        jitter: species.jitter,
        drift: species.drift
      });
    }
  }
}

function updateAndDrawParticles(){
  if (!particles.length) return;
  motionBoost *= 0.92; // decay any motion-triggered scatter
  const now = performance.now();

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const p of particles){
    p.vx += (Math.random() - 0.5) * 0.15 * (p.jitter + motionBoost);
    p.vy += (Math.random() - 0.5) * 0.15 * (p.jitter + motionBoost) - 0.02 * p.drift;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < -10) p.x = overlay.width + 10;
    if (p.x > overlay.width + 10) p.x = -10;
    if (p.y < -10) p.y = overlay.height + 10;
    if (p.y > overlay.height + 10) p.y = -10;

    const pulse = 1 + 0.12 * Math.sin(now * p.pulseSpeed + p.phase);
    const r = p.r * pulse;
    const [red, green, blue] = p.rgb;

    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    gradient.addColorStop(0, `rgba(${red},${green},${blue},${p.baseAlpha})`);
    gradient.addColorStop(0.7, `rgba(${red},${green},${blue},${p.baseAlpha * 0.5})`);
    gradient.addColorStop(1, `rgba(${red},${green},${blue},0)`);

    ctx.beginPath();
    ctx.fillStyle = gradient;
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function showError(msg){
  errorBox.textContent = msg;
  errorBox.style.display = "block";
}
function clearError(){
  errorBox.style.display = "none";
  errorBox.textContent = "";
}

async function initFaceDetector(){
  try{
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    faceDetector = await FaceDetector.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
        delegate: "GPU"
      },
      runningMode: "VIDEO"
    });
    faceDetectorReady = true;
  }catch(err){
    console.error("Face detector failed to load:", err);
    showError("Face detection model failed to load (check your internet connection). Motion detection will still work.");
    faceToggle.checked = false;
    faceToggle.disabled = true;
  }
}
initFaceDetector();

// Back camera only — better view for pointing the "smog" overlay at the world
// rather than yourself, and avoids the flip-camera race entirely.
const facingMode = "environment";

async function startCamera(){
  clearError();
  cameraBtn.disabled = true;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode },
      audio: false
    });
  }catch(err){
    console.error(err);
    showError("Could not access the camera: " + err.message + ". Check that you've granted camera permission and no other app is using it.");
    cameraBtn.disabled = false;
    return;
  }

  video.srcObject = stream;
  await video.play();

  video.style.display = "block";
  overlay.style.display = "block";
  placeholder.style.display = "none";

  await new Promise(resolve => {
    if (video.readyState >= 2) return resolve();
    video.onloadedmetadata = () => resolve();
  });

  overlay.width = video.videoWidth;
  overlay.height = video.videoHeight;

  camDot.classList.add("on");
  camStatus.textContent = "Camera: on";
  cameraBtn.classList.add("recording");
  cameraBtn.setAttribute("aria-label", "Stop camera");
  cameraBtn.title = "Stop camera";
  cameraIconOn.style.display = "none";
  cameraIconOff.style.display = "";
  cameraBtn.disabled = false;
  prevFrame = null;
  initParticles();

  rafId = requestAnimationFrame(processFrame);
}

function stopCamera(){
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  if (stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.pause();
  video.srcObject = null;
  video.style.display = "none";
  overlay.style.display = "none";
  placeholder.style.display = "flex";
  ctx.clearRect(0,0,overlay.width, overlay.height);

  camDot.classList.remove("on");
  camStatus.textContent = "Camera: off";
  faceDot.classList.remove("on");
  faceStatus.textContent = "Faces: 0";
  motionDot.classList.remove("on","alert");
  motionStatus.textContent = "Motion: idle";
  fpsStatus.textContent = "FPS: –";
  motionBoost = 0;

  cameraBtn.classList.remove("recording");
  cameraBtn.setAttribute("aria-label", "Start camera");
  cameraBtn.title = "Start camera";
  cameraIconOn.style.display = "";
  cameraIconOff.style.display = "none";
  cameraBtn.disabled = false;
}

function detectMotion(){
  motionCtx.drawImage(video, 0, 0, MOTION_W, MOTION_H);
  const frame = motionCtx.getImageData(0, 0, MOTION_W, MOTION_H).data;

  if (!prevFrame){
    prevFrame = frame;
    return { active: false, level: 0 };
  }

  let diffSum = 0;
  const total = MOTION_W * MOTION_H;
  for (let i = 0; i < frame.length; i += 4){
    const gray = (frame[i] + frame[i+1] + frame[i+2]) / 3;
    const prevGray = (prevFrame[i] + prevFrame[i+1] + prevFrame[i+2]) / 3;
    if (Math.abs(gray - prevGray) > 25) diffSum++;
  }
  prevFrame = frame;

  const ratio = diffSum / total;
  return { active: ratio > 0.02, level: ratio };
}

function drawFaces(detections){
  const sx = overlay.width / video.videoWidth;
  const sy = overlay.height / video.videoHeight;
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#3fb950";
  ctx.fillStyle = "#3fb950";
  ctx.font = "14px -apple-system, sans-serif";

  detections.forEach(det => {
    const box = det.boundingBox;
    const x = box.originX * sx;
    const y = box.originY * sy;
    const w = box.width * sx;
    const h = box.height * sy;
    ctx.strokeRect(x, y, w, h);
    const score = det.categories && det.categories[0] ? det.categories[0].score : 0;
    const label = `${Math.round(score*100)}%`;
    const textY = y > 16 ? y - 6 : y + h + 16;
    ctx.fillText(label, x, textY);
  });
}

function processFrame(){
  try{
    const now = performance.now();
    const dt = now - lastFrameTime;
    lastFrameTime = now;
    const fps = 1000/dt;
    fpsSmoothed = fpsSmoothed ? fpsSmoothed*0.9 + fps*0.1 : fps;
    fpsStatus.textContent = "FPS: " + Math.round(fpsSmoothed);

    ctx.clearRect(0, 0, overlay.width, overlay.height);

    if (particleToggle.checked){
      updateAndDrawParticles();
    }

    if (motionToggle.checked){
      const { active, level } = detectMotion();
      motionDot.classList.toggle("alert", active);
      motionDot.classList.toggle("on", !active);
      motionStatus.textContent = active
        ? `Motion: detected (${Math.round(level*100)}%)`
        : "Motion: idle";
      if (active){
        motionBoost = Math.min(6, motionBoost + level * 20);
        ctx.strokeStyle = "rgba(248,81,73,0.9)";
        ctx.lineWidth = 6;
        ctx.strokeRect(3, 3, overlay.width-6, overlay.height-6);
      }
    } else {
      motionDot.classList.remove("on","alert");
      motionStatus.textContent = "Motion: off";
      prevFrame = null;
    }

    if (faceToggle.checked && faceDetectorReady){
      const result = faceDetector.detectForVideo(video, now);
      drawFaces(result.detections);
      faceDot.classList.toggle("on", result.detections.length > 0);
      faceStatus.textContent = "Faces: " + result.detections.length;
    } else {
      faceDot.classList.remove("on");
      faceStatus.textContent = faceToggle.checked ? "Faces: loading model…" : "Faces: off";
    }
  }catch(err){
    // A single bad frame (e.g. mid camera-switch) must never permanently stop the loop.
    console.error("processFrame error:", err);
  }

  rafId = requestAnimationFrame(processFrame);
}

cameraBtn.addEventListener("click", () => {
  if (stream) stopCamera(); else startCamera();
});
indicatorBtn.addEventListener("click", () => {
  const isOpen = indicatorPanel.style.display !== "none";
  indicatorPanel.style.display = isOpen ? "none" : "flex";
});
window.addEventListener("beforeunload", stopCamera);
</script>
</body>
</html>
